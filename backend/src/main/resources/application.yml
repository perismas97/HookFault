server:
  port: 8080

spring:
  application:
    name: hookfault-backend
  datasource:
    url: ${HOOKFAULT_DATABASE_URL:jdbc:postgresql://localhost:5432/hookfault}
    username: ${HOOKFAULT_DATABASE_USERNAME:hookfault}
    password: ${HOOKFAULT_DATABASE_PASSWORD:hookfault}

hookfault:
  webhooks:
    allowed-origins:
      - http://localhost:8090
      - http://127.0.0.1:8090
      - http://[::1]:8090
      - http://demo-receiver:8090
      - http://host.docker.internal:8090

management:
  endpoints:
    web:
      exposure:
        include: health
