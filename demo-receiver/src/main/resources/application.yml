server:
  address: 127.0.0.1
  port: 8090
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: hookfault-demo-receiver
  datasource:
    url: ${HOOKFAULT_DATABASE_URL:jdbc:postgresql://localhost:5432/hookfault}
    username: ${HOOKFAULT_DATABASE_USERNAME:hookfault}
    password: ${HOOKFAULT_DATABASE_PASSWORD:hookfault}
  flyway:
    default-schema: hookfault_receiver
  servlet:
    multipart:
      enabled: false
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
