name: hookfault

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookfault
      POSTGRES_USER: hookfault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookfault}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hookfault-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      HOOKFAULT_DATABASE_URL: jdbc:postgresql://postgres:5432/hookfault
      HOOKFAULT_DATABASE_USERNAME: hookfault
      HOOKFAULT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hookfault}
      HOOKFAULT_DEMO_SIGNING_KEY_FILE: /run/secrets/demo_signing_key
    secrets:
      - demo_signing_key
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  demo-receiver:
    build:
      context: .
      dockerfile: demo-receiver/Dockerfile
    environment:
      SERVER_ADDRESS: 0.0.0.0
      HOOKFAULT_DEMO_SIGNING_KEY_FILE: /run/secrets/demo_signing_key
    secrets:
      - demo_signing_key
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  hookfault-postgres:
    name: hookfault-postgres

secrets:
  demo_signing_key:
    file: ./.secrets/demo-signing-key
