name: hookfault

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookfault
      POSTGRES_USER: hookfault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hookfault}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - hookfault-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      HOOKFAULT_DATABASE_URL: jdbc:postgresql://postgres:5432/hookfault
      HOOKFAULT_DATABASE_USERNAME: hookfault
      HOOKFAULT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-hookfault}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  hookfault-postgres:
    name: hookfault-postgres
